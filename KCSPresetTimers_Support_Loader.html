<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KCS Preset Timers Support</title>
  <style>
    html, body { height: 100%; margin: 0; font: 16px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    #status { padding: 1rem; white-space: pre-wrap; }
    #viewer { display: none; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <div id="status" role="status">Loading KCS Preset Timers Support from GitHub…</div>
  <iframe id="viewer" title="KCS Preset Timers Support"></iframe>
  <script>
    'use strict';
    const source = 'https://raw.githubusercontent.com/deweyduck6116/KCSPresetTimers/main/index.html';
    const status = document.getElementById('status');
    const viewer = document.getElementById('viewer');

    async function load() {
      try {
        const response = await fetch(source, { cache: 'no-store' });
        if (!response.ok) throw new Error(`GitHub returned HTTP ${response.status}.`);
        const html = await response.text();
        if (!/^\s*(?:<!doctype html|<html\b)/i.test(html)) {
          throw new Error('The response was not an HTML document.');
        }
        viewer.srcdoc = html;
        viewer.style.display = 'block';
        status.remove();
      } catch (error) {
        status.textContent = `Unable to load KCS Preset Timers Support.\n${error.message}\nCheck the internet connection and try refreshing this page.`;
      }
    }

    // Reload the loader after midnight so it fetches the current support HTML.
    const now = new Date();
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 7);
    setTimeout(() => location.reload(), next.getTime() - now.getTime());
    load();
  </script>
</body>
</html>
